name: CI

on:
  push:
    branches: [ master, erechnungpdf ]
  pull_request:
    branches: [ master, erechnungpdf ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, simplexml, dom

      - name: Run DocumentDataService Unit Tests
        run: php tests/Unit/DocumentDataServiceTest.php
