# Kubernetes Gateway API (Standard & Nachfolger der Ingress API)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openxe
  labels:
    app.kubernetes.io/name: openxe
spec:
  parentRefs:
    - name: default-gateway
  hostnames:
    - "openxe.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: openxe
          port: 80
