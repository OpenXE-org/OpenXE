apiVersion: batch/v1
kind: Job
metadata:
  name: openxe-migrate
  labels:
    app.kubernetes.io/name: openxe
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openxe
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: openxe-migrate
          image: ghcr.io/openxe-org/openxe:v1.13.0
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/docker-entrypoint.sh", "migrate"]
          env:
            - name: DB_HOST
              value: "openxe-mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "openxe"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: openxe-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openxe-db-credentials
                  key: password
            - name: USERDATA_PATH
              value: "/var/www/html/userdata"
          volumeMounts:
            - name: userdata
              mountPath: /var/www/html/userdata
      volumes:
        - name: userdata
          persistentVolumeClaim:
            claimName: openxe-userdata-pvc
